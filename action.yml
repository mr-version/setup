name: 'Setup Mister.Version'
description: 'Install and setup the Mister.Version CLI tool for semantic versioning in monorepos'
author: 'Mister.Version Team'

branding:
  icon: 'tag'
  color: 'blue'

inputs:
  version:
    description: 'Version of Mister.Version.CLI to install: latest (newest stable), prerelease (newest including prereleases), a specific version like 3.0.0, or a path to a local Mister.Version.CLI.<version>.nupkg'
    required: false
    default: 'latest'
  dotnet-version:
    description: 'Deprecated and ignored: this action does not install .NET. Run actions/setup-dotnet before this action (see README for runtime requirements).'
    required: false
    deprecationMessage: "The 'dotnet-version' input is ignored; this action does not install .NET. Use actions/setup-dotnet before mr-version/setup."
  cache:
    description: 'Cache the tool installation with the GitHub Actions cache service'
    required: false
    default: 'true'

outputs:
  tool-path:
    description: 'Path to the installed mr-version tool'
  cache-hit:
    description: 'Whether the tool was restored from cache'
  version:
    description: 'Actual version of the tool that was installed'

runs:
  using: 'node24'
  main: 'dist/index.js'